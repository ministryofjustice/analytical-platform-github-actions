---
name: Dependabot GH Actions Auto Merge

on:
  workflow_call:

permissions: {}

jobs:
  dependabot-auto-merge:
    name: Dependabot GH Actions Auto Merge
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Harden Runner
        if: github.event.repository.private == false
        id: harden_runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Fetch Dependabot Metadata
        id: fetch_metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for Checks
        if: >-
          steps.fetch_metadata.outputs.package-ecosystem == 'github-actions' &&
          (steps.fetch_metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.fetch_metadata.outputs.update-type == 'version-update:semver-patch')
        id: wait_for_checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr checks "${PR_URL}" --required --watch --fail-fast

      - name: Approve Pull Request
        if: >-
          steps.fetch_metadata.outputs.package-ecosystem == 'github-actions' &&
          (steps.fetch_metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.fetch_metadata.outputs.update-type == 'version-update:semver-patch')
        id: approve_pull_request
        env:
          GH_TOKEN: ${{ secrets.AP_DEPENDABOT_COMMIT_TOKEN }} # zizmor: ignore[secrets-outside-env] -- Dedicated Dependabot bot token is required for authenticated merge API calls
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          echo "Approving Pull Request: ${PR_URL}"
          gh pr review --approve "${PR_URL}"

      - name: Merge Pull Request
        if: >-
          steps.fetch_metadata.outputs.package-ecosystem == 'github-actions' &&
          (steps.fetch_metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.fetch_metadata.outputs.update-type == 'version-update:semver-patch')
        id: merge_pull_request
        env:
          GH_TOKEN: ${{ secrets.AP_DEPENDABOT_COMMIT_TOKEN }} # zizmor: ignore[secrets-outside-env] -- Dedicated Dependabot bot token is required for authenticated merge API calls
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          echo "Merging Pull Request: ${PR_URL}"
          gh pr merge --auto --squash "${PR_URL}"
